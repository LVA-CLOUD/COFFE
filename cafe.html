<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caféspot — Detalhes</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #F5F0E8;
            --espresso: #2C1810;
            --caramel: #C8873A;
            --latte: #D4A96A;
            --foam: #FBF6ED;
            --bark: #6B3D1E;
            --muted: #9A8070;
            --border: rgba(44, 24, 16, .10);
            --shadow: rgba(44, 24, 16, .12);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--espresso);
        }

        /* HEADER */
        header {
            background: var(--espresso);
            height: 64px;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .25);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--latte);
            text-decoration: none;
        }

        .logo span {
            color: var(--caramel);
            font-style: italic;
        }

        .btn-back {
            color: rgba(255, 255, 255, .65);
            background: none;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color .2s;
        }

        .btn-back:hover {
            color: var(--latte);
        }

        /* HERO DO CAFÉ */
        .cafe-hero {
            min-height: 300px;
            display: flex;
            align-items: flex-end;
            position: relative;
            padding: 2rem;
            overflow: hidden;
        }

        .hero-emoji {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            opacity: .25;
            pointer-events: none;
            filter: blur(2px);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(44, 24, 16, .85) 0%, transparent 60%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            color: #fff;
            max-width: 720px;
        }

        .hero-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: .8px;
            text-transform: uppercase;
            margin-bottom: .8rem;
            font-weight: 500;
        }

        .hero-badge.open {
            background: rgba(45, 122, 79, .8);
            color: #A8EFC6;
        }

        .hero-badge.closed {
            background: rgba(180, 60, 60, .75);
            color: #FFC5C5;
        }

        .hero-nome {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            line-height: 1.1;
            margin-bottom: .5rem;
        }

        .hero-tipo {
            color: rgba(255, 255, 255, .60);
            font-size: 14px;
            margin-bottom: .8rem;
        }

        .hero-meta {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero-stars {
            color: var(--caramel);
            font-size: 18px;
        }

        .hero-rating {
            font-size: 14px;
            color: rgba(255, 255, 255, .80);
        }

        .hero-dist {
            font-size: 13px;
            color: rgba(255, 255, 255, .55);
        }

        /* AÇÕES RÁPIDAS */
        .actions-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: .8rem 2rem;
            display: flex;
            gap: .8rem;
            flex-wrap: wrap;
        }

        .btn-action {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 24px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            border: 1px solid var(--border);
            text-decoration: none;
        }

        .btn-action.primary {
            background: var(--caramel);
            color: #fff;
            border-color: var(--caramel);
        }

        .btn-action.primary:hover {
            background: var(--bark);
        }

        .btn-action.outline {
            background: var(--foam);
            color: var(--espresso);
        }

        .btn-action.outline:hover {
            background: var(--cream);
        }

        /* LAYOUT */
        .page-layout {
            max-width: 1040px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2rem;
        }

        @media(max-width:780px) {
            .page-layout {
                grid-template-columns: 1fr;
                padding: 1.2rem;
            }
        }

        /* SEÇÕES */
        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--espresso);
            margin-bottom: 1rem;
            padding-bottom: .6rem;
            border-bottom: 1px solid var(--border);
        }

        .desc-text {
            font-size: 15px;
            line-height: 1.75;
            color: #5A4A42;
        }

        /* TAGS */
        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: var(--foam);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--bark);
        }

        /* GALERIA */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: var(--foam);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform .2s;
            user-select: none;
        }

        .gallery-item:hover {
            transform: scale(1.04);
        }

        /* ── SISTEMA DE AVALIAÇÕES ── */
        .reviews-summary {
            display: flex;
            gap: 2rem;
            align-items: center;
            background: var(--foam);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .rating-big {
            text-align: center;
        }

        .rating-number {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--caramel);
            line-height: 1;
        }

        .rating-stars {
            color: var(--caramel);
            font-size: 20px;
            margin: .3rem 0;
        }

        .rating-total {
            font-size: 12px;
            color: var(--muted);
        }

        .rating-bars {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .bar-label {
            width: 20px;
            color: var(--muted);
            text-align: right;
        }

        .bar-track {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--caramel);
            border-radius: 4px;
            transition: width .6s ease;
        }

        /* Lista de avaliações */
        .review-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            animation: fadeUp .3s ease both;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: .5rem;
        }

        .review-autor {
            font-weight: 500;
            color: var(--espresso);
            font-size: 14px;
        }

        .review-data {
            font-size: 11px;
            color: var(--muted);
        }

        .review-stars {
            color: var(--caramel);
            font-size: 13px;
            margin-bottom: .4rem;
        }

        .review-texto {
            font-size: 13px;
            color: #6B5B52;
            line-height: 1.55;
        }

        /* Formulário de avaliação */
        .review-form {
            background: var(--foam);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        /* Seletor de estrelas */
        .star-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 1rem;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .star-selector input {
            display: none;
        }

        .star-selector label {
            font-size: 2rem;
            cursor: pointer;
            color: #ddd;
            transition: color .15s, transform .15s;
        }

        .star-selector label:hover,
        .star-selector label:hover~label,
        .star-selector input:checked~label {
            color: var(--caramel);
        }

        .star-selector label:hover {
            transform: scale(1.15);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            background: #fff;
            color: var(--espresso);
            outline: none;
            transition: border-color .2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--caramel);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-submit {
            background: var(--caramel);
            color: #fff;
            border: none;
            padding: 11px 28px;
            border-radius: 24px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s;
        }

        .btn-submit:hover {
            background: var(--bark);
        }

        /* SIDEBAR */
        .sidebar {}

        .info-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .info-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-bottom: .6rem;
            border-bottom: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: .6rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .info-key {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .info-val {
            color: var(--espresso);
            font-weight: 500;
            margin-top: 1px;
        }

        .info-link {
            color: var(--caramel);
            text-decoration: none;
        }

        .info-link:hover {
            color: var(--bark);
        }

        /* Mapa mini */
        #mapaMini {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--foam);
            overflow: hidden;
        }

        /* Cafés próximos */
        .nearby-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: .7rem 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .15s;
            border-radius: 8px;
        }

        .nearby-item:last-child {
            border-bottom: none;
        }

        .nearby-item:hover {
            background: var(--foam);
            padding-left: 6px;
        }

        .nearby-emoji {
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            background: var(--cream);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nearby-nome {
            font-size: 13px;
            font-weight: 500;
            color: var(--espresso);
        }

        .nearby-dist {
            font-size: 11px;
            color: var(--muted);
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
    </style>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <header>
        <a href="cafespot.html" class="logo">Café<span>spot</span></a>
        <button class="btn-back" onclick="history.back()">← Voltar</button>
    </header>

    <!-- HERO -->
    <div class="cafe-hero" id="cafeHero">
        <div class="hero-emoji" id="heroEmoji"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-badge" id="heroBadge"></div>
            <div class="hero-nome" id="heroNome"></div>
            <div class="hero-tipo" id="heroTipo"></div>
            <div class="hero-meta">
                <div class="hero-stars" id="heroStars"></div>
                <div class="hero-rating" id="heroRating"></div>
                <div class="hero-dist" id="heroDist"></div>
            </div>
        </div>
    </div>

    <!-- BARRA DE AÇÕES -->
    <div class="actions-bar">
        <a class="btn-action primary" id="btnRota" href="#" target="_blank">📍 Como chegar</a>
        <button class="btn-action outline" onclick="compartilhar()">🔗 Compartilhar</button>
        <button class="btn-action outline" id="btnFav" onclick="favoritar()">⭐ Favoritar</button>
        <button class="btn-action outline"
            onclick="document.getElementById('secAvaliacao').scrollIntoView({behavior:'smooth'})">✍️ Avaliar</button>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="page-layout">

        <!-- COLUNA ESQUERDA -->
        <div class="col-main">

            <!-- Sobre -->
            <div class="section">
                <div class="section-title">Sobre o lugar</div>
                <p class="desc-text" id="descLonga"></p>
            </div>

            <!-- Galeria -->
            <div class="section">
                <div class="section-title">Galeria</div>
                <div class="gallery" id="galeria"></div>
            </div>

            <!-- Especialidades -->
            <div class="section">
                <div class="section-title">Especialidades</div>
                <div class="tags-wrap" id="tagsWrap"></div>
            </div>

            <!-- AVALIAÇÕES -->
            <div class="section" id="secAvaliacao">
                <div class="section-title">Avaliações</div>

                <div class="reviews-summary">
                    <div class="rating-big">
                        <div class="rating-number" id="ratingNum"></div>
                        <div class="rating-stars" id="ratingStars"></div>
                        <div class="rating-total" id="ratingTotal"></div>
                    </div>
                    <div class="rating-bars" id="ratingBars"></div>
                </div>

                <div id="listaReviews"></div>

                <!-- Formulário -->
                <div class="review-form">
                    <div class="form-title">Deixe sua avaliação</div>

                    <div class="star-selector" id="starSelector">
                        <input type="radio" name="nota" id="s5" value="5" /><label for="s5">★</label>
                        <input type="radio" name="nota" id="s4" value="4" /><label for="s4">★</label>
                        <input type="radio" name="nota" id="s3" value="3" /><label for="s3">★</label>
                        <input type="radio" name="nota" id="s2" value="2" /><label for="s2">★</label>
                        <input type="radio" name="nota" id="s1" value="1" /><label for="s1">★</label>
                    </div>

                    <div class="form-group">
                        <label>Seu nome</label>
                        <input type="text" id="fNome" placeholder="Como quer ser identificado?" maxlength="40" />
                    </div>
                    <div class="form-group">
                        <label>Comentário</label>
                        <textarea id="fTexto" placeholder="Conte sua experiência..."></textarea>
                    </div>
                    <button class="btn-submit" onclick="enviarReview()">Publicar avaliação</button>
                </div>
            </div>

        </div><!-- /col-main -->

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- Informações -->
            <div class="info-card">
                <div class="info-card-title">Informações</div>
                <div id="infoRows"></div>
            </div>

            <!-- Mini Mapa -->
            <div class="info-card">
                <div class="info-card-title">Localização</div>
                <div id="mapaMini"></div>
            </div>

            <!-- Outros cafés -->
            <div class="info-card">
                <div class="info-card-title">Outros por perto</div>
                <div id="nearbyList"></div>
            </div>

        </aside>

    </div><!-- /page-layout -->

    <script src="dados.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* ── Determina qual café mostrar (parâmetro ?id=N ou padrão 1) ── */
        const params = new URLSearchParams(location.search);
        const cafe = getCafeById(params.get('id') || 1);

        if (!cafe) {
            document.body.innerHTML = '<div style="padding:4rem;text-align:center;font-family:sans-serif">Café não encontrado. <a href="cafespot.html">Voltar</a></div>';
            throw new Error('Café não encontrado');
        }

        /* ── Preenche Hero ── */
        document.title = `Caféspot — ${cafe.nome}`;
        document.getElementById('cafeHero').style.background =
            `linear-gradient(135deg, ${cafe.bgColor} 0%, #2C1810 100%)`;
        document.getElementById('heroEmoji').textContent = cafe.emoji;
        document.getElementById('heroBadge').textContent = cafe.aberto ? '🟢 Aberto agora' : '🔴 Fechado';
        document.getElementById('heroBadge').className = 'hero-badge ' + (cafe.aberto ? 'open' : 'closed');
        document.getElementById('heroNome').textContent = cafe.nome;
        document.getElementById('heroTipo').textContent = cafe.tipo;
        document.getElementById('heroStars').textContent = renderStars(cafe.stars);
        document.getElementById('heroRating').textContent = `${cafe.rating} (${cafe.avaliacoes} avaliações)`;
        document.getElementById('heroDist').textContent = `📍 ${cafe.distancia} · ${cafe.bairro}`;

        /* ── Botão rota ── */
        document.getElementById('btnRota').href =
            `https://www.google.com/maps/dir/?api=1&destination=${cafe.lat},${cafe.lng}`;

        /* ── Sobre ── */
        document.getElementById('descLonga').textContent = cafe.descLonga;

        /* ── Galeria ── */
        document.getElementById('galeria').innerHTML = cafe.fotos.map(f =>
            `<div class="gallery-item">${f}</div>`
        ).join('');

        /* ── Tags ── */
        document.getElementById('tagsWrap').innerHTML = cafe.tags.map(t =>
            `<span class="tag">${t}</span>`
        ).join('');

        /* ── Informações sidebar ── */
        document.getElementById('infoRows').innerHTML = `
    <div class="info-row">
      <div class="info-icon">🕐</div>
      <div><div class="info-key">Horário</div><div class="info-val">${cafe.horario}</div></div>
    </div>
    <div class="info-row">
      <div class="info-icon">📍</div>
      <div><div class="info-key">Endereço</div><div class="info-val">${cafe.endereco}</div></div>
    </div>
    <div class="info-row">
      <div class="info-icon">💰</div>
      <div><div class="info-key">Preço médio</div><div class="info-val">${cafe.preco}</div></div>
    </div>
    <div class="info-row">
      <div class="info-icon">📞</div>
      <div><div class="info-key">Telefone</div>
        <div class="info-val"><a class="info-link" href="https://wa.me/55${cafe.telefone.replace(/\D/g, '')}" target="_blank">${cafe.telefone}</a></div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-icon">📸</div>
      <div><div class="info-key">Instagram</div>
        <div class="info-val"><a class="info-link" href="https://instagram.com/${cafe.instagram.replace('@', '')}" target="_blank">${cafe.instagram}</a></div>
      </div>
    </div>
  `;

        /* ── Mini Mapa (Leaflet) ── */
        const map = L.map('mapaMini', { zoomControl: false, attributionControl: false })
            .setView([cafe.lat, cafe.lng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const icon = L.divIcon({
            html: `<div style="background:#C8873A;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3)">${cafe.emoji}</div>`,
            className: '', iconSize: [32, 32], iconAnchor: [16, 16],
        });
        L.marker([cafe.lat, cafe.lng], { icon }).addTo(map)
            .bindPopup(cafe.nome).openPopup();

        /* ── Cafés próximos ── */
        const nearby = CAFES.filter(c => c.id !== cafe.id).slice(0, 3);
        document.getElementById('nearbyList').innerHTML = nearby.map(c => `
    <div class="nearby-item" onclick="location.href='cafe.html?id=${c.id}'">
      <div class="nearby-emoji">${c.emoji}</div>
      <div>
        <div class="nearby-nome">${c.nome}</div>
        <div class="nearby-dist">${c.distancia} · ${c.bairro}</div>
      </div>
    </div>
  `).join('');

        /* ── AVALIAÇÕES ── */
        function carregarReviews() {
            const base = cafe.reviews || [];
            const extra = getSavedReviews(cafe.id);
            const todas = [...extra, ...base];

            /* Resumo */
            const total = cafe.avaliacoes + extra.length;
            document.getElementById('ratingNum').textContent = cafe.rating;
            document.getElementById('ratingStars').textContent = renderStars(Math.round(cafe.rating));
            document.getElementById('ratingTotal').textContent = total + ' avaliações';

            /* Barras de distribuição */
            const dist = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
            todas.forEach(r => { if (dist[r.nota] !== undefined) dist[r.nota]++; });
            const max = Math.max(...Object.values(dist), 1);
            document.getElementById('ratingBars').innerHTML = [5, 4, 3, 2, 1].map(n => `
      <div class="bar-row">
        <div class="bar-label">${n}★</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(dist[n] / max) * 100}%"></div></div>
        <div style="font-size:11px;color:var(--muted);width:20px">${dist[n]}</div>
      </div>
    `).join('');

            /* Lista */
            document.getElementById('listaReviews').innerHTML = todas.map(r => `
      <div class="review-card">
        <div class="review-header">
          <div class="review-autor">${r.autor}</div>
          <div class="review-data">${r.data}</div>
        </div>
        <div class="review-stars">${renderStars(r.nota)}</div>
        <div class="review-texto">${r.texto}</div>
      </div>
    `).join('');
        }

        function enviarReview() {
            const notaEl = document.querySelector('input[name="nota"]:checked');
            const nome = document.getElementById('fNome').value.trim();
            const texto = document.getElementById('fTexto').value.trim();

            if (!notaEl) { alert('Selecione uma nota (1 a 5 estrelas).'); return; }
            if (!nome) { alert('Digite seu nome.'); return; }
            if (!texto) { alert('Escreva um comentário.'); return; }

            const hoje = new Date();
            const data = `${String(hoje.getDate()).padStart(2, '0')}/${String(hoje.getMonth() + 1).padStart(2, '0')}/${hoje.getFullYear()}`;
            saveReview(cafe.id, { autor: nome, nota: parseInt(notaEl.value), texto, data });
            carregarReviews();

            /* Limpa form */
            document.querySelectorAll('input[name="nota"]').forEach(r => r.checked = false);
            document.getElementById('fNome').value = '';
            document.getElementById('fTexto').value = '';

            alert('✅ Avaliação publicada! Obrigado pelo feedback.');
        }

        /* ── Favoritar ── */
        function favoritar() {
            const btn = document.getElementById('btnFav');
            btn.textContent = btn.textContent.includes('⭐') ? '💛 Favoritado!' : '⭐ Favoritar';
        }

        /* ── Compartilhar ── */
        function compartilhar() {
            if (navigator.share) {
                navigator.share({ title: cafe.nome, text: cafe.desc, url: location.href });
            } else {
                navigator.clipboard.writeText(location.href).then(() => alert('Link copiado!'));
            }
        }

        carregarReviews();
    </script>
</body>

</html>
